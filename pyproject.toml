[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtu-synbio-lab-automation"
version = "0.1.0"
description = "Automation protocols, robot guides, and reusable unit operations for synthetic biology workflows at DTU."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "DTU Synbio Lab Automation" }
]
license = { text = "MIT" }
dependencies = [
  "click>=8.1",
  "ipykernel>=6.29",
  "jupyter>=1.1",
  "opentrons>=8.0",
  "pandas>=2.2",
  "python-dotenv>=1.0",
  "ruff>=0.6",
  "sphinx>=8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
