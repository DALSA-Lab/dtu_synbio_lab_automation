[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "data-science-template-for-dtu-bioengineering"
version = "0.1.0"
description = "Template for DTU Bioengineering data science projects."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Technical University of Denmark, DTU" }
]
license = { text = "MIT" }
dependencies = [
  "awscli",
  "click",
  "coverage",
  "flake8",
  "python-dotenv>=0.5.1",
  "Sphinx",
]

[tool.setuptools.packages.find]
include = ["src*"]
